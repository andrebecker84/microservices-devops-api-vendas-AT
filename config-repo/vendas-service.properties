server.port=8082

# H2 em memoria
spring.datasource.url=jdbc:h2:mem:vendasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Feign para o produtos-service: sem limite, um servico travado seguraria a venda por 60 s
spring.cloud.openfeign.client.config.produtos-service.connect-timeout=2000
spring.cloud.openfeign.client.config.produtos-service.read-timeout=5000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
