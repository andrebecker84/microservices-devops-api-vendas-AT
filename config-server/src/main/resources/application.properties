server.port=8888

spring.application.name=config-server

# Backend "native": le os .properties direto da pasta config-repo, sem exigir um
# repositorio Git. O caminho antigo (file:///Users/wesley/...) so existia na maquina
# do professor. Os dois caminhos relativos cobrem rodar a partir da raiz do projeto
# ou de dentro de config-server/.
# No Docker, as variaveis de ambiente do compose apontam para /config-repo.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo,file:../config-repo
