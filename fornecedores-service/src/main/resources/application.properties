# Config minima local: nome da aplicacao (usado para buscar
# "fornecedores-service.properties" no config-server) e o endereco do config-server.
# O restante das configuracoes (porta, datasource, eureka...) vem do
# config-server, em config-repo/fornecedores-service.properties.
spring.application.name=fornecedores-service
spring.config.import=optional:configserver:http://localhost:8888
