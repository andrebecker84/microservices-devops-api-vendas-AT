apiVersion: apps/v1
kind: Deployment
metadata:
  name: fornecedores-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fornecedores-service
  template:
    metadata:
      labels:
        app: fornecedores-service
    spec:
      initContainers:          # rodam antes do container principal, um de cada vez
        - name: espera-eureka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z eureka-server 8761; do sleep 2; done']
        - name: espera-config-server
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z config-server 8888; do sleep 2; done']
      containers:
        - name: fornecedores-service
          image: fornecedores-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            # Porta explicita: se o config-server falhar, o import e "optional:"
            # e a app subiria na 8080 padrao, quebrando o readinessProbe.
            - name: SERVER_PORT
              value: "8084"
            # NAO use EUREKA_CLIENT_SERVICEURL_DEFAULTZONE aqui: serviceUrl e um
            # Map, e a env var vira a chave minuscula "defaultzone", enquanto o
            # Eureka le "defaultZone" -- o default localhost:8761 acabava vencendo.
            - name: SPRING_APPLICATION_JSON
              value: '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://eureka-server:8761/eureka/"}}}}'
            # O Eureka registrava o hostname do Pod (ex: produtos-service-abc123),
            # que NAO tem registro no DNS do cluster -> o gateway falhava com
            # UnknownHostException/NXDOMAIN. Aqui forcamos o IP do Pod, que e
            # roteavel. Sao escalares, entao a env var vincula sem problema.
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            tcpSocket: { port: 8084 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fornecedores-service
  namespace: ecommerce
spec:
  selector:
    app: fornecedores-service
  ports:
    - port: 8084
      targetPort: 8084